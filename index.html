<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Reliveing Letter Generator</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="wrap">
      <h1>Reliving Letter</h1>
      <label for="name">Employee Name</label>
      <input type="text" id="name" placeholder="Enter your full name">
      <label for="employee-id">Employee ID</label>
      <input type="text" id="employee-id" placeholder="Enter your Employee ID">
      <label for="employee-email">Employee Email</label>
      <input type="email" id="employee-email" placeholder="Enter your Employee Email">
      <label for="designation">Designation</label>
      <input type="text" id="designation" placeholder="Enter your Designation">
      <label for="department">Department</label>
      <input type="text" id="department" placeholder="Enter your Department">
      <label for="employment-type">Employment Type</label>
      <input type="text" id="employment-type" placeholder="Enter your Employment Type">
      <label for="date-of-joining">Date of Joining</label>
      <input type="date" id="date-of-joining">
      <label for="last-working-day">Last Working Day</label>
      <input type="date" id="last-working-day" placeholder="Enter your Last working Day">
      <label for="letter-date">Letter Date (Statement Date)</label>
      <input type="date" id="letter-date" placeholder="Enter the date of the letter">
      <label for="notice-period">Notice Period(Days)</label>
      <input type="text" id="notice-period" placeholder="Enter the notice period">
      <label for="work-location">Work Location</label>
      <input type="text" id="work-location" placeholder="Enter your Work Location">
      <label for="signatory-designation">Signatory Designation</label>
      <input type="text" id="signatory-designation" placeholder="Enter the signatory's designation">
      <label for="HR Contact">HR Contact</label>
      <input type="text" id="HR Contact" placeholder="Enter the HR contact">
      <button>Generate Letter</button>
      <button>Download Letter</button>
      <button>Send Via Email</button>
    </div>
  </body>
</html>
